    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; color: #5b3b31; font-family: ui-rounded, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; background: linear-gradient(rgba(255,248,236,.34), rgba(255,248,236,.18)), url("public/generated-assets/page-background.png") center / cover no-repeat, #fff8ec; }
      body::before, body::after { content: ""; position: fixed; z-index: 0; pointer-events: none; opacity: .78; }
      body::before { left: max(8px, calc(50% - 260px)); top: 9px; width: 178px; height: 45px; transform: rotate(-13deg); background: repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 9px, transparent 9px 18px), #ef9fbd; border: 1px dashed rgba(125,82,83,.22); }

      .phone-frame { position: relative; width: min(100%, calc(100dvh * 390 / 700), 430px); padding: clamp(8px,2vw,12px); border: 2px solid rgba(210,166,122,.36); border-radius: 8px; background: linear-gradient(rgba(214,164,116,.1) 1px, transparent 1px), linear-gradient(90deg, rgba(214,164,116,.1) 1px, transparent 1px), #fffaf0; background-size: 24px 24px; box-shadow: 0 14px 38px rgba(99,63,37,.12), inset 0 0 0 7px rgba(255,255,255,.46); overflow: hidden; }

      button.secondary { background: #a99ad2; background-image: url("public/generated-assets/ui-leaderboard-button.png"); background-size: 100% 100%; border-color: transparent; color: #fffaf0; box-shadow: inset 0 0 0 2px rgba(255,255,255,.16), 0 5px 0 rgba(105,85,138,.22); }

      .button-row .image-button { width: 150px; height: 66px; }
      .image-button.secondary { color: #fffaf0; }
      .image-button.cream { color: #6a4234; }
      .image-button img { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; user-select: none; }
      .image-button span { position: relative; z-index: 1; padding-bottom: 4px; pointer-events: none; text-shadow: 0 1px 0 rgba(255,255,255,.36); }
      .image-button::before, .image-button::after, .overlay .image-button::before, .overlay .image-button::after, .button-row .image-button::before, .button-row .image-button::after { display: none; }
      .image-button:active { transform: translateY(3px) scale(.985); }
      #menu, #result.result-success, #result.result-fail { border: 0; box-shadow: none; background-repeat: no-repeat; background-position: center; background-size: cover; }
      #menu { justify-content: flex-start; gap: 18px; padding-top: 270px; background-image: url("public/generated-assets/ui-menu-bg.png"); }
      #menu::before, #result::before { display: none; }
      #menu h1, #menu p, #result h2 { display: none; }
      #menu .logo-bubble { width: 126px; height: 112px; transform: none; margin: 0 0 76px; }
      #result.result-success { background-image: url("public/generated-assets/ui-result-success-bg.png"); }
      #result.result-fail { background-image: url("public/generated-assets/ui-result-fail-bg.png"); }

      #result .logo-bubble { width: 178px; height: 168px; margin-bottom: 0; transform: none; }
      #result #reason, #result .stat-grid, #result .button-row { transform: translateY(200px); }
      #result #reason { margin: 0 0 4px; padding: 4px 10px; border-radius: 8px; background: rgba(255,250,240,.62); font-weight: 850; }
      #result { gap: 7px; padding-top: 204px; }
      #result .logo-bubble { width: 156px; height: 146px; margin-bottom: 1px; }
      #result #reason, #result .stat-grid, #result .button-row { transform: none; }
      #result .stat-grid { gap: 5px; }
      #result .stat-grid span { padding-top: 8px; padding-bottom: 8px; background: rgba(255,250,240,.68); }

      #result .button-row .image-button { width: 142px; height: 62px; }
      #result #reason { position: relative; top: 30px; margin-bottom: 34px; }
      .image-button, .overlay .image-button, .button-row .image-button { --button-offset-y: 0px; transform: translateY(var(--button-offset-y)); transition: filter 120ms ease, transform 120ms ease; }
      .image-button:active { transform: translateY(calc(var(--button-offset-y) + 3px)) scale(.985); }
      .image-button.clicked { animation: button-pop 180ms ease-out; }
      @keyframes button-pop { 0% { transform: translateY(var(--button-offset-y)) scale(1); } 45% { transform: translateY(calc(var(--button-offset-y) - 4px)) scale(1.055); } 100% { transform: translateY(var(--button-offset-y)) scale(1); } }
      #menu .logo-bubble { transform: translateY(-30px); }
      #menu > .image-button { --button-offset-y: -70px; }
      #menu > .image-button.secondary { --button-offset-y: -90px; }
      .hidden { display: none; }
      @media (max-width: 520px) { .game-shell { padding: 8px; display: block; } .phone-frame { width: min(100%, calc(100dvh * 390 / 700)); max-height: 100dvh; padding: 8px; } .overlay { inset: 8px; padding: 20px; } .top-hud { top: 16px; } .bottom-hud { bottom: 16px; } .hud { left: 18px; right: 18px; } h1 { font-size: 31px; } }

  <body>
    <main class="game-shell" aria-label="这杯有点太刺激了游戏">
      <section class="phone-frame" aria-label="game area">
        <div class="hud top-hud">
          <div><small>当前角色</small><strong id="currentRole">西米</strong></div>
          <div><small>进度</small><strong id="progress">0/2</strong></div>
          <div><small>存活时间</small><strong id="timer">00:00</strong></div>
        </div>
        <canvas id="game" width="390" height="700" aria-label="game canvas"></canvas>
        <div class="hud bottom-hud"><span id="message">追着小料探索，合成更大的甜甜小料。</span><b><span id="score">0</span> 分</b></div>
        <div id="menu" class="overlay">
          <div class="logo-bubble"><img src="public/generated-assets/ui-title-badge.png" alt="" /></div>
          <button class="image-button" id="startBtn"><img src="public/generated-assets/ui-start-button.png" alt="" aria-hidden="true" /><span>开始游戏</span></button>
          <button class="image-button secondary" id="rankBtn"><img src="public/generated-assets/ui-leaderboard-button.png" alt="" aria-hidden="true" /><span>排行榜</span></button>
        </div>
        <div id="result" class="overlay hidden">
          <div class="logo-bubble"><img id="resultIcon" src="public/generated-assets/ui-victory-burst.png" alt="" /></div>
          <h2 id="resultTitle">这杯有点太刺激了</h2>
          <p id="reason"></p>
          <div class="stat-grid"><span>存活时间 <b id="finalTime">00:00</b></span><span>最高等级 <b id="finalLevel">西米</b></span><span>最终分数 <b id="finalScore">0</b></span></div>
          <div class="button-row"><button class="image-button" id="againBtn"><img src="public/generated-assets/ui-start-button.png" alt="" aria-hidden="true" /><span>再来一局</span></button><button class="image-button secondary" id="toRankBtn"><img src="public/generated-assets/ui-leaderboard-button.png" alt="" aria-hidden="true" /><span>看排行榜</span></button></div>
        </div>
        <div id="rank" class="overlay hidden">
          <h2>本地排行榜</h2>
          <ol id="rankList" class="leaderboard"></ol>
          <div class="button-row"><button class="image-button" id="rankStartBtn"><img src="public/generated-assets/ui-start-button.png" alt="" aria-hidden="true" /><span>开始游戏</span></button><button class="image-button cream" id="backBtn"><img src="public/generated-assets/ui-cream-button.png" alt="" aria-hidden="true" /><span>返回</span></button></div>
        </div>
      </section>
    </main>
    <script>
      (() => {
        const W = 390, H = 700, WORLD_W = 690, WORLD_H = 1230, SCALE = 1.75;
        const CUP = { topY: 46, bottomY: 1188, topW: 575, bottomW: 405, centerX: WORLD_W / 2 };
        const levels = [
          ['西米','topping-sago.png',1], ['红豆','topping-red-bean.png',1.22], ['椰果粒','topping-coconut.png',1.34], ['芒果','topping-mango.png',1.78], ['珍珠','topping-boba.png',2.15],
          ['布丁','topping-pudding.png',2.58], ['仙草','topping-grass-jelly.png',3.51], ['芋圆','topping-taro-ball.png',4.12], ['奶盖球','topping-cheese-foam.png',4.6], ['柿子','topping-persimmon.png',5.39]
        ];
        const assetNames = ['scene-milk-tea-cup.png','scene-straw.png','scene-tea-surface.png','effect-shake-wave.png','ui-success-reward.png','ui-fail-burst.png', ...levels.map(l => l[1])];
        const assets = {};
        assetNames.forEach(name => { const img = new Image(); img.src = 'public/generated-assets/' + name; assets[name] = img; });
        const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
        const els = Object.fromEntries(['menu','result','rank','currentRole','progress','timer','message','score','resultTitle','reason','finalTime','finalLevel','finalScore','rankList','resultIcon'].map(id => [id, document.getElementById(id)]));
        const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
        const rand = (a,b) => a + Math.random() * (b-a);
        const fmt = ms => { const t = Math.max(0, Math.floor(ms/1000)); return String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0'); };
        const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
        const cupT = y => clamp((y-CUP.topY)/(CUP.bottomY-CUP.topY),0,1);
        const cupHalf = y => CUP.topW/2 + (CUP.bottomW/2-CUP.topW/2)*cupT(y);
        const radiusFor = level => (level === 1 ? 7.2 : 8.6 * levels[level-1][2]);
        const bounds = (y,r=0) => ({ left: CUP.centerX - cupHalf(y) + r, right: CUP.centerX + cupHalf(y) - r });
        const inside = (x,y,r) => y >= CUP.topY+r && y <= CUP.bottomY-r && x >= bounds(y,r).left && x <= bounds(y,r).right;
        const keep = item => { const y = clamp(item.y, CUP.topY+item.r*.35, CUP.bottomY-item.r*.35); const b = bounds(y,item.r*.35); if (item.x < b.left || item.x > b.right) item.vx *= -.72; if (item.y !== y) item.vy *= -.72; item.x = clamp(item.x,b.left,b.right); item.y = y; };
        let state = 'menu', runtime = null, pointer = {active:false,x:W/2/SCALE,y:H/2/SCALE}, keys = new Set();
        function inView(point, margin=42){ const vw=W/SCALE, vh=H/SCALE; return point.x>=runtime.camera.x-margin && point.x<=runtime.camera.x+vw+margin && point.y>=runtime.camera.y-margin && point.y<=runtime.camera.y+vh+margin; } function sameLevelVisible(level){ return runtime.toppings.filter(t=>t.level===level && inView(t,t.r+18)).length; } function addToppings(n, forced) { for (let i=0;i<n;i++) { let lvl = forced || clamp(Math.ceil(Math.random()*Math.min(10, runtime.player.level+2)), 1, 10); if(!forced && lvl===runtime.player.level && sameLevelVisible(lvl)>=2) lvl=Math.min(10,lvl+1); if(lvl===runtime.player.level && sameLevelVisible(lvl)>=2) continue; const r = radiusFor(lvl); let point={x:CUP.centerX,y:CUP.bottomY-r-20}, found=false; for(let a=0;a<80;a++){ let y = rand(CUP.topY+r+20, CUP.bottomY-r-20), b = bounds(y,r+14); point={x:rand(b.left,b.right), y}; if(dist(point,runtime.player)>runtime.player.r+r+55 && (runtime.elapsed<600 || !inView(point,r+64))){ found=true; break; } } if(!found && runtime.elapsed>=600) continue; if(!forced && runtime.player.level>=9 && Math.random()<.48){ lvl=10; } runtime.toppings.push({x:point.x, y:point.y, vx:rand(-52,52), vy:rand(-52,52), level:lvl, r:radiusFor(lvl), spin:rand(0,7)}); } }
        function start() { runtime = { start: performance.now(), last: performance.now(), elapsed:0, score:0, high:1, player:{x:CUP.centerX,y:CUP.bottomY-160,vx:0,vy:0,level:1,r:radiusFor(1),carry:0,orbit:[],bag:Array(11).fill(0)}, toppings:[], camera:{x:0,y:720}, event:null, nextEvent:3250, ended:false }; addToppings(8,1); addToppings(2,2); state='playing'; hideAll(); requestAnimationFrame(loop); }
        function hideAll(){ els.menu.classList.add('hidden'); els.result.classList.add('hidden'); els.rank.classList.add('hidden'); }
        function showMenu(){ state='menu'; hideAll(); els.menu.classList.remove('hidden'); draw(); }
        function showRank(){ state='rank'; hideAll(); renderRank(); els.rank.classList.remove('hidden'); draw(); }
        function finish(title, reason, won=false) { runtime.ended = true; state='result'; els.result.className = 'overlay ' + (won ? 'result-success' : 'result-fail'); els.resultIcon.src = won ? 'public/generated-assets/ui-success-reward.png' : 'public/generated-assets/ui-fail-burst.png'; const record={score:runtime.score, time:runtime.elapsed, level:runtime.high, date:Date.now(), title}; const list=JSON.parse(localStorage.getItem('shake_static_rank')||'[]'); list.push(record); list.sort((a,b)=>b.level-a.level||b.score-a.score||b.time-a.time); localStorage.setItem('shake_static_rank', JSON.stringify(list.slice(0,10))); els.resultTitle.textContent=title; els.reason.textContent=reason; els.finalTime.textContent=fmt(runtime.elapsed); els.finalLevel.textContent=levels[runtime.high-1][0]; els.finalScore.textContent=runtime.score; hideAll(); els.result.classList.remove('hidden'); }
        function renderRank(){ const list=JSON.parse(localStorage.getItem('shake_static_rank')||'[]'); els.rankList.innerHTML = list.length ? list.map((r,i)=>`<li><span class="rank">#${i+1}</span><span class="record-main"><b>${r.title}</b><small>${levels[r.level-1][0]} / ${fmt(r.time)}</small></span><strong>${r.score}</strong></li>`).join('') : '<li><span class="record-main"><b>还没有成绩</b><small>第一杯奶茶，等你来摇。</small></span></li>'; }
        function normalizePlayer(p){ const counts=(p.bag||Array(11).fill(0)).slice(); counts[p.level]=(counts[p.level]||0)+1; for(let lvl=1; lvl<levels.length; lvl++){ while((counts[lvl]||0)>=3){ counts[lvl]-=3; counts[lvl+1]=(counts[lvl+1]||0)+1; } } let next=p.level; for(let lvl=levels.length; lvl>=1; lvl--){ if((counts[lvl]||0)>0){ next=lvl; break; } } counts[next]-=1; p.level=next; p.r=radiusFor(next); p.bag=Array(11).fill(0); for(let lvl=1; lvl<=levels.length; lvl++) p.bag[lvl]=Math.max(0,counts[lvl]||0); p.carry=Math.min(2,p.bag[p.level]||0); }
        function strawStabs(){ const ys=[CUP.topY+360,CUP.topY+610,CUP.topY+860], xs=[CUP.centerX-cupHalf(ys[0])*.48,CUP.centerX,CUP.centerX+cupHalf(ys[2])*.48]; return xs.map((x,i)=>({x,y:ys[i],fromX:x,fromY:CUP.topY-270-i*18})); }
        function strawPhase(e, now){ const period=1680, elapsed=Math.max(0,now-(e.warnUntil||e.started+850)); return {strike:Math.min(2,Math.floor(elapsed/period)), phase:(elapsed%period)/period, period}; }
        function pointInRect(point, stab, half){ const dx=stab.x-stab.fromX, dy=stab.y-stab.fromY, len=Math.max(1,Math.hypot(dx,dy)), ux=dx/len, uy=dy/len, px=point.x-stab.fromX, py=point.y-stab.fromY, along=px*ux+py*uy, cross=Math.abs(px*-uy+py*ux); return along>=-64-point.r && along<=len+64+point.r && cross<=half; }
        function drawStrawRect(stab, active){ const dx=stab.x-stab.fromX, dy=stab.y-stab.fromY, len=Math.hypot(dx,dy)+120, width=64; ctx.save(); ctx.translate((stab.x+stab.fromX)/2,(stab.y+stab.fromY)/2); ctx.rotate(Math.atan2(dy,dx)-Math.PI/2); ctx.fillStyle=active?'rgba(255,52,88,.2)':'rgba(255,52,88,.14)'; ctx.strokeStyle=active?'rgba(255,255,255,.72)':'rgba(255,52,88,.92)'; ctx.lineWidth=active?7:5; ctx.setLineDash(active?[24,10]:[14,9]); ctx.beginPath(); ctx.roundRect(-width/2,-len/2,width,len,18); ctx.fill(); ctx.stroke(); ctx.restore(); }
        function drawStrawBody(stab, phase){ const thrust=phase<.42?phase/.42:phase<.68?1:1-(phase-.68)/.32, eased=clamp(thrust,0,1), tipY=stab.fromY+(stab.y-stab.fromY)*eased; drawAsset(assets['scene-straw.png'],stab.x,(stab.fromY+tipY)/2,100,Math.max(260,tipY-stab.fromY+240),.95); }        function drawCupPath(){ const top=CUP.topW/2, bottom=CUP.bottomW/2; ctx.beginPath(); ctx.moveTo(CUP.centerX-top,CUP.topY); ctx.lineTo(CUP.centerX+top,CUP.topY); ctx.lineTo(CUP.centerX+bottom,CUP.bottomY); ctx.lineTo(CUP.centerX-bottom,CUP.bottomY); ctx.closePath(); }
        function drawAsset(img,x,y,w,h,a=1){ if(!img || !img.complete) return; ctx.save(); ctx.globalAlpha=a; ctx.drawImage(img,x-w/2,y-h/2,w,h); ctx.restore(); }
        function bg(){ const g=ctx.createLinearGradient(0,0,0,WORLD_H); g.addColorStop(0,'#fffaf0'); g.addColorStop(.55,'#fff2dd'); g.addColorStop(1,'#f5d7b9'); ctx.fillStyle=g; ctx.fillRect(-200,-200,WORLD_W+400,WORLD_H+400); ctx.strokeStyle='rgba(203,149,104,.18)'; ctx.lineWidth=1.2; for(let x=-200;x<WORLD_W+220;x+=34){ctx.beginPath();ctx.moveTo(x,-200);ctx.lineTo(x,WORLD_H+220);ctx.stroke();} for(let y=-200;y<WORLD_H+220;y+=34){ctx.beginPath();ctx.moveTo(-200,y);ctx.lineTo(WORLD_W+220,y);ctx.stroke();} ctx.strokeStyle='rgba(145,102,69,.16)'; ctx.lineWidth=4; ctx.setLineDash([16,14]); ctx.strokeRect(16,18,WORLD_W-32,WORLD_H-36); ctx.setLineDash([]); }
        function drawIngredient(item, player=false){ const img=assets[levels[item.level-1][1]], size=item.r*(player?3.15:2.9); if(player){ ctx.save(); ctx.filter='drop-shadow(0 0 5px rgba(255,205,95,.95))'; drawAsset(img,item.x,item.y,size,size); ctx.restore(); } else drawAsset(img,item.x,item.y,size,size); }
        function drawPlayer(){ const p=runtime.player; const pieces=[]; for(let lvl=levels.length; lvl>=1; lvl--){ const count=(p.bag&&p.bag[lvl])||0; for(let i=0;i<count;i++) pieces.push(lvl); } const t=runtime.elapsed/1000; pieces.slice(0,36).forEach((lvl,i)=>{ const ring=Math.floor(i/10), slot=i%10, a=slot/10*Math.PI*2 + ring*.5 + t*(.88+ring*.16); const rr=p.r+15+ring*12; drawIngredient({x:p.x+Math.cos(a)*rr,y:p.y+Math.sin(a)*rr,level:lvl,r:Math.max(5.8, radiusFor(lvl)*.54)}); }); drawIngredient(p,true); }
        function draw(){ ctx.clearRect(0,0,W,H); const screen=ctx.createLinearGradient(0,0,W,H); screen.addColorStop(0,'#fffaf0'); screen.addColorStop(1,'#f7d7bd'); ctx.fillStyle=screen; ctx.fillRect(0,0,W,H); ctx.save(); if(runtime){ ctx.scale(SCALE,SCALE); ctx.translate(-runtime.camera.x,-runtime.camera.y); } else { ctx.translate((W-WORLD_W*.42)/2,35); ctx.scale(.42,.42); } bg(); ctx.save(); const shakeDraw=runtime&&runtime.event&&runtime.event.kind==='shake'; if(shakeDraw){ const elapsed=performance.now()-(runtime.event.started||performance.now()), angle=Math.sin(elapsed/42)*4.95; ctx.translate(CUP.centerX,(CUP.topY+CUP.bottomY)/2); ctx.rotate(angle); ctx.translate(-CUP.centerX,-(CUP.topY+CUP.bottomY)/2); } drawCupPath(); ctx.fillStyle='rgba(255,255,255,.26)'; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,.82)'; ctx.lineWidth=7; ctx.stroke(); drawAsset(assets['scene-milk-tea-cup.png'],CUP.centerX,(CUP.topY+CUP.bottomY)/2,CUP.topW+90,CUP.bottomY-CUP.topY+118,.5); drawCupPath(); const tea=ctx.createLinearGradient(0,CUP.topY,0,CUP.bottomY); tea.addColorStop(0,'rgba(245,211,158,.54)'); tea.addColorStop(.48,'rgba(226,172,116,.60)'); tea.addColorStop(1,'rgba(194,132,82,.64)'); ctx.fillStyle=tea; ctx.fill(); ctx.save(); drawCupPath(); ctx.clip(); if(runtime){ runtime.toppings.sort((a,b)=>a.level-b.level).forEach(t=>drawIngredient(t)); drawPlayer(); if(runtime.event){ const t=runtime.event; if(t.kind==='shake'){ ctx.strokeStyle='rgba(255,255,255,.48)'; ctx.lineWidth=12; for(let i=0;i<8;i++){ ctx.beginPath(); const y=CUP.topY+105+i*132; ctx.moveTo(CUP.centerX-190,y); ctx.bezierCurveTo(CUP.centerX-80,y-80,CUP.centerX+80,y+80,CUP.centerX+190,y); ctx.stroke(); } } if(t.kind==='straw'){ if(!t.stabs)t.stabs=strawStabs(); const drawNow=performance.now(), warn=drawNow<(t.warnUntil||t.started+850); if(warn){ t.stabs.forEach(s=>drawStrawRect(s,false)); } else { const ph=strawPhase(t,drawNow), stab=t.stabs[ph.strike]; drawStrawRect(stab,true); drawStrawBody(stab,ph.phase); } } } } else drawAsset(assets['ui-title-badge.png'],CUP.centerX,(CUP.topY+CUP.bottomY)/2+20,250,220,.95); ctx.restore(); ctx.restore(); ctx.restore(); if(state !== 'playing'){ ctx.fillStyle='rgba(255,250,240,.18)'; ctx.fillRect(0,0,W,H); } }
        function update(dt, now){ runtime.elapsed = now - runtime.start; const p=runtime.player; let dx=0,dy=0; if(keys.has('a')||keys.has('arrowleft')) dx--; if(keys.has('d')||keys.has('arrowright')) dx++; if(keys.has('w')||keys.has('arrowup')) dy--; if(keys.has('s')||keys.has('arrowdown')) dy++; if(!dx&&!dy&&pointer.active){ const sx=p.x-runtime.camera.x, sy=p.y-runtime.camera.y; dx=pointer.x-sx; dy=pointer.y-sy; } const len=Math.hypot(dx,dy); if(len>.4){ dx/=len; dy/=len; p.vx+=(dx*180-p.vx)*.18; p.vy+=(dy*180-p.vy)*.18; } else { p.vx*=.86; p.vy*=.86; } p.x+=p.vx*dt; p.y+=p.vy*dt; keep(p); runtime.toppings.forEach(t=>{ t.vx+=Math.cos(now/620+t.spin)*18*dt; t.vy+=Math.sin(now/760+t.spin)*18*dt; const lim=180*(.8+(t.level-1)/9*.7), sp=Math.hypot(t.vx,t.vy); if(sp>lim){ t.vx=t.vx/sp*lim; t.vy=t.vy/sp*lim; } t.x+=t.vx*dt; t.y+=t.vy*dt; keep(t); }); for(let i=runtime.toppings.length-1;i>=0;i--){ const t=runtime.toppings[i]; if(dist(p,t)<p.r+t.r*.72){ if(t.level>p.level) return finish('这杯有点太刺激了','撞上了更大的' + levels[t.level-1][0], false); runtime.toppings.splice(i,1); runtime.score += t.level*20; const old=p.level; p.bag[t.level]=(p.bag[t.level]||0)+1; normalizePlayer(p); if(p.level>old){ runtime.high=Math.max(runtime.high,p.level); runtime.score += p.level*100; if(p.level>=10) return finish('挑战成功！奖励大放送','你合成了传说中的柿子', true); } } } if(runtime.toppings.length < 16 + p.level*3) addToppings(2); if(runtime.elapsed > runtime.nextEvent){ runtime.event = Math.random()<.35 ? {kind:'shake', until: now+2100} : (Math.random()<.7 ? {kind:'straw', x:rand(CUP.centerX-190,CUP.centerX+190), y:rand(CUP.topY+290,CUP.bottomY-150), started:now, warnUntil:now+850, until: now+5890} : null); runtime.nextEvent = runtime.elapsed + rand(3715,6570); } if(runtime.event){ if(runtime.event.kind==='shake'){ [p,...runtime.toppings].forEach((t,i)=>{ const ox=t.x-CUP.centerX, oy=t.y-(CUP.topY+CUP.bottomY)/2, len=Math.max(80,Math.hypot(ox,oy)), tx=-oy/len, ty=ox/len, pulse=Math.sin(now/42); const kick=(i?384:246)*pulse; t.vx += tx*kick; t.vy += ty*kick; }); } if(runtime.event.kind==='straw' && now>(runtime.event.warnUntil||0)){ if(!runtime.event.stabs) runtime.event.stabs=strawStabs(); const ph=strawPhase(runtime.event,now), stab=runtime.event.stabs[ph.strike]; if(ph.phase>=.42 && ph.phase<=.68 && pointInRect(p,stab,32)){ const title='这杯有点太刺激了', reason='你被吸管戳到了'; runtime.ended=true; draw(); setTimeout(()=>finish(title,reason,false),1000); return; } } if(now>runtime.event.until) { runtime.event=null; runtime.score+=100; } } const viewW=W/SCALE, viewH=H/SCALE; runtime.camera.x += (clamp(p.x-viewW/2,0,WORLD_W-viewW)-runtime.camera.x)*.12; runtime.camera.y += (clamp(p.y-viewH/2,0,WORLD_H-viewH)-runtime.camera.y)*.12; }
        function loop(now){ if(state!=='playing'||!runtime||runtime.ended) return; const dt=Math.min(.033, Math.max(.001,(now-runtime.last)/1000)); runtime.last=now; update(dt,now); draw(); els.currentRole.innerHTML = `<img class="hud-icon" src="public/generated-assets/${levels[runtime.player.level-1][1]}" alt="" /> ${levels[runtime.player.level-1][0]}`; els.progress.textContent = runtime.player.carry + '/2'; els.timer.textContent=fmt(runtime.elapsed); els.score.textContent=runtime.score; els.message.textContent=runtime.event ? (runtime.event.kind==='straw'?'吸管要来了，快躲开红框！':'奶茶正在旋转摇晃，小料飞起来了！') : '追着小料探索，合成更大的甜甜小料。'; requestAnimationFrame(loop); }
        canvas.addEventListener('pointerdown', e=>{ pointer.active=true; canvas.setPointerCapture(e.pointerId); movePointer(e); });
        canvas.addEventListener('pointermove', e=>{ if(e.pointerType !== 'touch') pointer.active = true; movePointer(e); }); canvas.addEventListener('pointerup', e=>{ if(e.pointerType === 'touch') pointer.active=false; }); canvas.addEventListener('pointercancel', e=>{ if(e.pointerType === 'touch') pointer.active=false; });
        function movePointer(e){ const r=canvas.getBoundingClientRect(); pointer.x=(e.clientX-r.left)/r.width*W/SCALE; pointer.y=(e.clientY-r.top)/r.height*H/SCALE; }
        addEventListener('keydown', e=>{ const k=e.key.toLowerCase(); if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){ e.preventDefault(); keys.add(k); }});
        addEventListener('keyup', e=>keys.delete(e.key.toLowerCase()));
        document.getElementById('startBtn').onclick=start; document.getElementById('againBtn').onclick=start; document.getElementById('rankStartBtn').onclick=start;
        document.getElementById('rankBtn').onclick=showRank; document.getElementById('toRankBtn').onclick=showRank; document.getElementById('backBtn').onclick=showMenu; document.querySelectorAll('.image-button').forEach(btn=>btn.addEventListener('click',()=>{btn.classList.remove('clicked'); void btn.offsetWidth; btn.classList.add('clicked');}));
        showMenu();
      })();
